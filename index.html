<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Tiang — Pemeriksaan Mutu Tiang TELKOM | by Mighty</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1c2426; --steel:#3a4a52; --steel-light:#5d7079;
    --paper:#eef1ee; --paper-dark:#dfe4df; --rule:#c7cdc4;
    --pass:#2f6b4f; --pass-bg:#e3f1e8; --fail:#a23b2e; --fail-bg:#fbe8e4;
    --amber:#b3791f; --mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 36px;}
  header{background:var(--ink);color:var(--paper);padding:28px 32px 22px;position:relative;overflow:hidden;border-bottom:6px solid var(--amber);}
  header .tape{position:absolute;top:0;right:-40px;bottom:0;width:180px;background:repeating-linear-gradient(135deg,var(--amber) 0 14px,var(--ink) 14px 28px);opacity:.85;}
  header h1{margin:0;font-size:26px;letter-spacing:.5px;font-weight:800;text-transform:uppercase;}
  header .sub{font-family:var(--mono);font-size:13px;color:#b7c4c0;margin-top:6px;letter-spacing:.5px;}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 24px 80px;}
  .typebar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .typebar button{font-family:var(--mono);font-size:12.5px;letter-spacing:.3px;border:1px solid var(--steel);background:var(--paper);padding:9px 16px;cursor:pointer;color:var(--steel);font-weight:600;text-transform:uppercase;}
  .typebar button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .typebar button:disabled{opacity:.4;cursor:not-allowed;}
  .typebar button:not(:disabled):not(.active):hover{background:var(--paper-dark);}
  .panel{background:#fff;border:1px solid var(--rule);}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--rule);background:var(--paper-dark);}
  .panel-head h2{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.6px;}
  .panel-head .spec-tag{font-family:var(--mono);font-size:12px;color:var(--steel-light);}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;}
  .field{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:13px 16px;}
  .field label{display:block;font-size:11px;color:var(--steel-light);line-height:1.35;margin-bottom:7px;min-height:28px;}
  .field .spec{display:block;font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-bottom:6px;}
  .field input[type="text"]{width:100%;border:none;border-bottom:2px solid var(--steel-light);background:transparent;font-family:var(--mono);font-size:15px;padding:4px 2px;color:var(--ink);}
  .field input[type="text"]:focus{outline:none;border-bottom-color:var(--ink);}
  .field input.bad{border-bottom-color:var(--fail);color:var(--fail);}
  .field input.good{border-bottom-color:var(--pass);color:var(--pass);}
  .evidence-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .evidence-btn{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2px;border:1px dashed var(--steel-light);background:transparent;padding:6px 10px;cursor:pointer;color:var(--steel-light);}
  .evidence-btn:hover{border-color:var(--steel);color:var(--steel);}
  .evidence-btn.has-photo{border-style:solid;border-color:var(--pass);color:var(--pass);}
  .evidence-thumb{width:34px;height:34px;object-fit:cover;border:1px solid var(--rule);cursor:pointer;flex:none;}
  .evidence-clear{border:none;background:none;color:var(--steel-light);cursor:pointer;font-size:13px;}
  .evidence-clear:hover{color:var(--fail);}
  .ev-cell{display:flex;align-items:center;gap:6px;}
  .ev-thumb-sm{width:28px;height:28px;object-fit:cover;border:1px solid var(--rule);cursor:pointer;}
  .ev-none{color:var(--steel-light);font-size:11px;}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(20,24,22,.88);z-index:999;align-items:center;justify-content:center;padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:92vw;max-height:86vh;border:3px solid #fff;}
  .lightbox .lb-close{position:absolute;top:18px;right:24px;color:#fff;font-size:28px;cursor:pointer;font-family:var(--mono);background:none;border:none;}
  .lightbox .lb-cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#cfd6d1;font-family:var(--mono);font-size:12px;}
  .actions{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;gap:12px;flex-wrap:wrap;}
  .actions .note{font-size:12px;color:var(--steel-light);font-family:var(--mono);}
  .btn{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.4px;padding:11px 22px;border:none;cursor:pointer;text-transform:uppercase;}
  .btn-add{background:var(--ink);color:#fff;}
  .btn-add:hover{background:var(--steel);}
  .btn-ghost{background:transparent;border:1px solid var(--steel);color:var(--steel);}
  .btn-ghost:hover{background:var(--paper-dark);}
  .btn-pdf{background:var(--amber);color:#fff;border:none;}
  .btn-pdf:hover{opacity:.88;}
  .btn-pdf:disabled{opacity:.45;cursor:not-allowed;}
  .resultbar{margin-top:0;padding:14px 18px;font-family:var(--mono);font-size:13px;display:none;align-items:center;gap:10px;border:1px solid;border-top:none;}
  .resultbar.show{display:flex;}
  .resultbar.pass{background:var(--pass-bg);border-color:var(--pass);color:var(--pass);}
  .resultbar.fail{background:var(--fail-bg);border-color:var(--fail);color:var(--fail);}
  .resultbar .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;}
  .tablewrap{margin-top:34px;}
  .tablewrap h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 12px;}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px;}
  thead th{background:var(--steel);color:#fff;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;font-size:11px;letter-spacing:.2px;position:sticky;top:0;}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--rule);font-family:var(--mono);white-space:nowrap;}
  tbody tr:nth-child(even){background:var(--paper);}
  .cell-fail{color:var(--fail);font-weight:700;}
  .cell-pass{color:var(--pass);}
  .status-pill{display:inline-block;padding:3px 10px;font-weight:700;font-size:11px;letter-spacing:.4px;}
  .status-pill.PASS{background:var(--pass-bg);color:var(--pass);}
  .status-pill.FAIL{background:var(--fail-bg);color:var(--fail);}
  .del-btn{border:none;background:none;color:var(--steel-light);cursor:pointer;font-size:14px;}
  .del-btn:hover{color:var(--fail);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--steel-light);font-family:var(--mono);font-size:13px;border:1px dashed var(--rule);background:#fff;}
  .tablescroll{overflow-x:auto;border:1px solid var(--rule);}
  .toolrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .summary-chip{font-family:var(--mono);font-size:12px;color:var(--steel-light);}
  .summary-chip b{color:var(--ink);}
  .pdf-loading{position:fixed;inset:0;background:rgba(28,36,38,.7);z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font-family:var(--mono);font-size:14px;}
  .pdf-loading.show{display:flex;}
  .pdf-spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media print{.typebar,.actions,.resultbar,header .tape,.btn,.toolrow{display:none !important;}body{background:#fff;}}
  @media (max-width:640px){
    header{padding:20px 18px 18px;}
    header h1{font-size:20px;}
    .wrap{padding:16px 14px 60px;}
    .formgrid{grid-template-columns:1fr;}
    .field{border-right:none;}
    .panel-head{flex-direction:column;align-items:flex-start;gap:4px;}
    .actions{flex-direction:column;align-items:stretch;}
    .actions .note{order:2;}
    .actions>div{display:flex;gap:10px;flex-wrap:wrap;}
    .actions>div .btn{flex:1;}
    .toolrow{flex-direction:column;align-items:stretch;}
    .toolrow>div{display:flex;gap:8px;flex-wrap:wrap;}
    .typebar button{flex:1 1 calc(50% - 10px);text-align:center;}
  }
</style>
</head>
<body>

<header>
  <div class="tape"></div>
  <h1>QC Tiang</h1>
  <div class="sub">Pemeriksaan Mutu &middot; Tiang TELKOM &middot; input meter → otomatis ke mm &middot; Export PDF + Evidence</div>
</header>

<div class="wrap">
  <div class="typebar" id="typebar">
    <button data-type="7m3" class="active">7 Meter — 3 Segmen</button>
    <button data-type="7m2">7 Meter — 2 Segmen</button>
    <button data-type="9m">9 Meter</button>
    <button data-type="galv6" disabled title="Menyusul">Galvanis 6 Meter</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">Tiang 7 Meter — 3 Segmen</h2>
      <span class="spec-tag" id="panelSpecTag"></span>
    </div>
    <div class="formgrid" id="formgrid"></div>
    <div class="actions">
      <span class="note">Isi nomor tiang, ukuran sesuai satuan input, lampirkan foto evidence tiap kolom. PASS/FAIL otomatis.</span>
      <div>
        <button class="btn btn-ghost" id="clearFormBtn">Bersihkan</button>
        <button class="btn btn-add" id="addRowBtn">+ Tambah ke Tabel</button>
      </div>
    </div>
    <div class="resultbar" id="resultbar"><span class="dot"></span><span id="resultText"></span></div>
  </div>

  <div class="tablewrap">
    <div class="toolrow">
      <h2>Hasil Pemeriksaan</h2>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="summary-chip" id="summaryChip">0 tiang diperiksa</span>
        <button class="btn btn-ghost" id="exportCsvBtn">Export CSV</button>
        <button class="btn btn-pdf" id="exportPdfBtn" disabled>Export PDF</button>
      </div>
    </div>
    <div id="tableArea"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="Evidence">
  <div class="lb-cap" id="lbCap"></div>
</div>

<div class="pdf-loading" id="pdfLoading">
  <div class="pdf-spinner"></div>
  <span id="pdfLoadingText">Membuat PDF...</span>
</div>

<script>
// ===================== SPEC DEFINITIONS =====================
const SPEC_7M3 = {
  id:'7m3', label:'Tiang Beton 7 Meter — 3 Segmen',
  fields:[
    {key:'panjang_total',    label:'Panjang total',                      unit:'mm', inputUnit:'m',  kind:'range', nominal:7000,  tol:40},
    {key:'bahan_atas',       label:'Panjang bahan ruas Atas',            unit:'mm', inputUnit:'m',  kind:'range', nominal:1570,  tol:20},
    {key:'bahan_tengah',     label:'Panjang bahan ruas Tengah',          unit:'mm', inputUnit:'m',  kind:'range', nominal:1570,  tol:20},
    {key:'bahan_bawah',      label:'Panjang bahan ruas Bawah',           unit:'mm', inputUnit:'m',  kind:'range', nominal:4260,  tol:20},
    {key:'ruas_atas',        label:'Panjang ruas tiang Atas',            unit:'mm', inputUnit:'m',  kind:'range', nominal:1370,  tol:20},
    {key:'ruas_tengah',      label:'Panjang ruas tiang Tengah',          unit:'mm', inputUnit:'m',  kind:'range', nominal:1370,  tol:20},
    {key:'ruas_bawah',       label:'Panjang ruas tiang Bawah',           unit:'mm', inputUnit:'m',  kind:'range', nominal:4260,  tol:20},
    {key:'lakop_panjang',    label:'Panjang Lakop',                      unit:'cm', inputUnit:'cm', kind:'min',   nominal:40},
    {key:'lakop_tebal',      label:'Tebal Lakop',                        unit:'mm', inputUnit:'mm', kind:'min',   nominal:3},
    {key:'diam_atas',        label:'Diameter luar ruas Atas',            unit:'mm', inputUnit:'mm', kind:'range', nominal:76.3,  tol:2},
    {key:'diam_tengah',      label:'Diameter luar ruas Tengah',          unit:'mm', inputUnit:'mm', kind:'range', nominal:114.3, tol:2.9},
    {key:'diam_bawah',       label:'Diameter luar ruas Bawah',           unit:'mm', inputUnit:'mm', kind:'range', nominal:139.8, tol:3.5},
    {key:'tebal_atas',       label:'Tebal tiang ruas Atas',              unit:'mm', inputUnit:'mm', kind:'asym',  nominal:4,     plusPct:15, minusPct:12.5},
    {key:'tebal_tengah',     label:'Tebal tiang ruas Tengah',            unit:'mm', inputUnit:'mm', kind:'asym',  nominal:4,     plusPct:15, minusPct:12.5},
    {key:'tebal_bawah',      label:'Tebal tiang ruas Bawah',             unit:'mm', inputUnit:'mm', kind:'asym',  nominal:4,     plusPct:15, minusPct:12.5},
    {key:'berat_aktual',     label:'Berat tiang aktual (termasuk tutup)',unit:'kg', inputUnit:'kg', kind:'min',   nominal:71.4,  note:'Min 71,4 kg · Nominal 91 kg'},
  ]
};

const SPEC_7M2 = {
  id:'7m2', label:'Tiang Beton 7 Meter — 2 Segmen',
  fields:[
    {key:'panjang_total',    label:'Panjang total',                         unit:'mm', inputUnit:'m',  kind:'range', nominal:7000,  tol:40},
    {key:'bahan_atas',       label:'Panjang bahan segmen Atas',             unit:'mm', inputUnit:'m',  kind:'range', nominal:2940,  tol:20},
    {key:'bahan_bawah',      label:'Panjang bahan segmen Bawah',            unit:'mm', inputUnit:'m',  kind:'range', nominal:4260,  tol:20},
    {key:'ruas_atas',        label:'Panjang ruas tiang segmen Atas',        unit:'mm', inputUnit:'m',  kind:'range', nominal:2740,  tol:20},
    {key:'ruas_bawah',       label:'Panjang ruas tiang segmen Bawah',       unit:'mm', inputUnit:'m',  kind:'range', nominal:4260,  tol:20},
    {key:'diam_atas',        label:'Diameter luar segmen Atas',             unit:'mm', inputUnit:'mm', kind:'range', nominal:76.3,  tol:2},
    {key:'diam_bawah',       label:'Diameter luar segmen Bawah',            unit:'mm', inputUnit:'mm', kind:'range', nominal:114.3, tol:2.9},
    {key:'tebal_atas',       label:'Tebal tiang segmen Atas',               unit:'mm', inputUnit:'mm', kind:'asym',  nominal:2.9,   plusPct:15, minusPct:12.5},
    {key:'tebal_bawah',      label:'Tebal tiang segmen Bawah',              unit:'mm', inputUnit:'mm', kind:'asym',  nominal:2.9,   plusPct:15, minusPct:12.5},
    {key:'berat_aktual',     label:'Berat tiang aktual (termasuk tutup+lakop)',unit:'kg',inputUnit:'kg',kind:'min',  nominal:52.5,  note:'Min 52,5 kg'},
    {key:'lakop_tebal',      label:'Tebal Lakop',                           unit:'mm', inputUnit:'mm', kind:'min',   nominal:3},
    {key:'lakop_panjang',    label:'Panjang Lakop',                         unit:'cm', inputUnit:'cm', kind:'min',   nominal:40},
  ]
};

const SPEC_9M = {
  id:'9m', label:'Tiang Beton 9 Meter — 3 Segmen',
  fields:[
    {key:'panjang_total',    label:'Panjang total',                      unit:'mm', inputUnit:'m',  kind:'range', nominal:9000,  tol:40},
    {key:'bahan_atas',       label:'Panjang bahan ruas Atas',            unit:'mm', inputUnit:'m',  kind:'range', nominal:2200,  tol:40},
    {key:'bahan_tengah',     label:'Panjang bahan ruas Tengah',          unit:'mm', inputUnit:'m',  kind:'range', nominal:2200,  tol:40},
    {key:'bahan_bawah',      label:'Panjang bahan ruas Bawah',           unit:'mm', inputUnit:'m',  kind:'range', nominal:5000,  tol:40},
    {key:'ruas_atas',        label:'Panjang ruas tiang Atas',            unit:'mm', inputUnit:'m',  kind:'range', nominal:2000,  tol:40},
    {key:'ruas_tengah',      label:'Panjang ruas tiang Tengah',          unit:'mm', inputUnit:'m',  kind:'range', nominal:2000,  tol:40},
    {key:'ruas_bawah',       label:'Panjang ruas tiang Bawah',           unit:'mm', inputUnit:'m',  kind:'range', nominal:5000,  tol:40},
    {key:'lakop_panjang',    label:'Panjang Lakop',                      unit:'cm', inputUnit:'cm', kind:'min',   nominal:40},
    {key:'lakop_tebal',      label:'Tebal Lakop',                        unit:'mm', inputUnit:'mm', kind:'min',   nominal:3},
    {key:'diam_atas',        label:'Diameter luar ruas Atas',            unit:'mm', inputUnit:'mm', kind:'range', nominal:76.3,  tol:2},
    {key:'diam_tengah',      label:'Diameter luar ruas Tengah',          unit:'mm', inputUnit:'mm', kind:'range', nominal:114.3, tol:2.9},
    {key:'diam_bawah',       label:'Diameter luar ruas Bawah',           unit:'mm', inputUnit:'mm', kind:'range', nominal:139.8, tol:3.5},
    {key:'tebal_atas',       label:'Tebal tiang ruas Atas',              unit:'mm', inputUnit:'mm', kind:'asym',  nominal:4,     plusPct:15, minusPct:12.5},
    {key:'tebal_tengah',     label:'Tebal tiang ruas Tengah',            unit:'mm', inputUnit:'mm', kind:'asym',  nominal:4,     plusPct:15, minusPct:12.5},
    {key:'tebal_bawah',      label:'Tebal tiang ruas Bawah',             unit:'mm', inputUnit:'mm', kind:'asym',  nominal:5,     plusPct:15, minusPct:12.5},
    {key:'berat_aktual',     label:'Berat tiang aktual (termasuk tutup)',unit:'kg', inputUnit:'kg', kind:'record', note:'Nominal 130 kg'},
  ]
};

const ALL_SPECS = {'7m3':SPEC_7M3, '7m2':SPEC_7M2, '9m':SPEC_9M};

// ===================== HELPERS =====================
function unitFactor(f){
  if(f.inputUnit===f.unit) return 1;
  if(f.inputUnit==='m'  && f.unit==='mm') return 1000;
  if(f.inputUnit==='cm' && f.unit==='mm') return 10;
  if(f.inputUnit==='mm' && f.unit==='cm') return 0.1;
  return 1;
}
function specRange(f){
  if(f.kind==='range')  return {min:f.nominal-f.tol, max:f.nominal+f.tol};
  if(f.kind==='asym')   return {min:f.nominal*(1-f.minusPct/100), max:f.nominal*(1+f.plusPct/100)};
  if(f.kind==='min')    return {min:f.nominal, max:Infinity};
  if(f.kind==='record') return {min:-Infinity, max:Infinity};
}
function specText(f){
  if(f.kind==='range')  return `(${f.nominal} ± ${f.tol}) ${f.unit}`;
  if(f.kind==='asym')   return `${f.nominal} ${f.unit} +${f.plusPct}% / -${f.minusPct}%`;
  if(f.kind==='min')    return f.note ? f.note : `min ${f.nominal} ${f.unit}`;
  if(f.kind==='record') return f.note || 'Dicatat saja';
}
function checkValue(f, raw){
  if(raw===''||raw===null||raw===undefined) return null;
  const v = parseFloat(String(raw).replace(',','.'));
  if(isNaN(v)) return null;
  const converted = v * unitFactor(f);
  const r = specRange(f);
  return {value:converted, inputValue:v, ok:converted>=r.min && converted<=r.max, min:r.min, max:r.max};
}
function fmtVal(v,f){ return v===null?'—': `${v.inputValue} ${f.inputUnit}` + (unitFactor(f)!==1?` (${Number(v.value.toFixed(2))} ${f.unit})`:''); }

// ===================== STATE =====================
let activeSpec = SPEC_7M3;
let rows = [];
let rowCounter = 1;
let formEvidence = {};

// ===================== TYPE SWITCHER =====================
document.getElementById('typebar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-type]');
  if(!btn || btn.disabled) return;
  document.querySelectorAll('.typebar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeSpec = ALL_SPECS[btn.dataset.type];
  renderForm();
  document.getElementById('resultbar').classList.remove('show');
  renderTable();
});

// ===================== RENDER FORM =====================
function renderForm(){
  const grid = document.getElementById('formgrid');
  grid.innerHTML='';
  formEvidence={};
  document.getElementById('panelTitle').textContent = activeSpec.label;
  document.getElementById('panelSpecTag').textContent = `${activeSpec.fields.length} parameter pemeriksaan`;

  const idField=document.createElement('div');
  idField.className='field';
  idField.innerHTML=`<label>Nomor / Identitas Tiang</label><span class="spec" style="visibility:hidden">x</span><input type="text" id="f_nomor" placeholder="cth. TG-001">`;
  grid.appendChild(idField);

  activeSpec.fields.forEach(f=>{
    const div=document.createElement('div');
    div.className='field';
    div.innerHTML=`
      <label>${f.label} <span style="color:var(--steel-light)">(input: ${f.inputUnit})</span></label>
      <span class="spec">${specText(f)}</span>
      <input type="text" inputmode="decimal" id="f_${f.key}" data-key="${f.key}" placeholder="0">
      <div class="evidence-row" id="evrow_${f.key}">
        <button type="button" class="evidence-btn" data-key="${f.key}">📷 Evidence</button>
        <input type="file" accept="image/*" capture="environment" id="evfile_${f.key}" data-key="${f.key}" style="display:none">
      </div>`;
    grid.appendChild(div);
  });

  grid.querySelectorAll('input[type="text"][data-key]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const f=activeSpec.fields.find(x=>x.key===inp.dataset.key);
      const res=checkValue(f,inp.value);
      inp.classList.remove('good','bad');
      if(res) inp.classList.add(res.ok?'good':'bad');
    });
  });
  grid.querySelectorAll('.evidence-btn').forEach(btn=>{
    btn.addEventListener('click',()=>document.getElementById('evfile_'+btn.dataset.key).click());
  });
  grid.querySelectorAll('input[type="file"]').forEach(fi=>{
    fi.addEventListener('change',e=>{
      const file=e.target.files[0]; if(!file) return;
      const url=URL.createObjectURL(file);
      formEvidence[fi.dataset.key]={url,name:file.name};
      renderEvidenceRow(fi.dataset.key);
    });
  });
}

function renderEvidenceRow(key){
  const row=document.getElementById('evrow_'+key);
  const ev=formEvidence[key];
  if(!ev){
    row.innerHTML=`<button type="button" class="evidence-btn" data-key="${key}">📷 Evidence</button>
      <input type="file" accept="image/*" capture="environment" id="evfile_${key}" data-key="${key}" style="display:none">`;
  } else {
    row.innerHTML=`<img src="${ev.url}" class="evidence-thumb" data-url="${ev.url}" data-cap="${key}">
      <button type="button" class="evidence-btn has-photo" data-key="${key}">✓ Foto OK</button>
      <button type="button" class="evidence-clear" data-key="${key}" title="Hapus">✕</button>
      <input type="file" accept="image/*" capture="environment" id="evfile_${key}" data-key="${key}" style="display:none">`;
  }
  const fi=row.querySelector('input[type="file"]');
  fi.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    formEvidence[key]={url:URL.createObjectURL(file),name:file.name};
    renderEvidenceRow(key);
  });
  row.querySelector('.evidence-btn').addEventListener('click',()=>fi.click());
  const clr=row.querySelector('.evidence-clear');
  if(clr) clr.addEventListener('click',()=>{delete formEvidence[key];renderEvidenceRow(key);});
  const th=row.querySelector('.evidence-thumb');
  if(th) th.addEventListener('click',()=>openLightbox(ev.url,key));
}

document.getElementById('clearFormBtn').addEventListener('click',()=>{
  renderForm();
  document.getElementById('resultbar').classList.remove('show');
});

document.getElementById('addRowBtn').addEventListener('click',()=>{
  const nomor=(document.getElementById('f_nomor').value.trim())||`TG-${String(rowCounter).padStart(3,'0')}`;
  const values={};
  let allFilled=true, allPass=true;
  activeSpec.fields.forEach(f=>{
    const inp=document.getElementById('f_'+f.key);
    const res=checkValue(f,inp.value);
    if(res===null) allFilled=false;
    else if(!res.ok) allPass=false;
    values[f.key]={raw:inp.value,result:res,evidence:formEvidence[f.key]?{...formEvidence[f.key]}:null};
  });
  const rb=document.getElementById('resultbar');
  const rt=document.getElementById('resultText');
  if(!allFilled){
    rb.className='resultbar fail show';
    rt.textContent='Lengkapi seluruh kolom sebelum menambahkan ke tabel.';
    return;
  }
  rows.push({id:rowCounter++,nomor,specId:activeSpec.id,specLabel:activeSpec.label,fields:[...activeSpec.fields],values,overall:allPass?'PASS':'FAIL'});
  rb.className='resultbar '+(allPass?'pass':'fail')+' show';
  rt.textContent=allPass
    ?`Tiang ${nomor}: LULUS QC — seluruh ${activeSpec.fields.length} parameter sesuai spesifikasi.`
    :`Tiang ${nomor}: TIDAK LULUS QC — terdapat parameter di luar toleransi.`;
  renderForm();
  renderTable();
});

// ===================== RENDER TABLE =====================
function renderTable(){
  const area=document.getElementById('tableArea');
  const chip=document.getElementById('summaryChip');
  const total=rows.length;
  const passCount=rows.filter(r=>r.overall==='PASS').length;
  chip.innerHTML=`<b>${total}</b> tiang diperiksa &nbsp;·&nbsp; <span style="color:var(--pass)"><b>${passCount}</b> lulus</span> &nbsp;·&nbsp; <span style="color:var(--fail)"><b>${total-passCount}</b> tidak lulus</span>`;
  document.getElementById('exportPdfBtn').disabled = total===0;

  if(total===0){
    area.innerHTML=`<div class="empty-state">Belum ada data. Isi form di atas lalu klik "Tambah ke Tabel".</div>`;
    return;
  }
  const fields=activeSpec.fields;
  let html=`<div class="tablescroll"><table><thead><tr>
    <th>No</th><th>Identitas</th><th>Jenis Tiang</th>
    ${fields.map(f=>`<th>${f.label}<br><span style="font-weight:400;font-size:10px;opacity:.8">(${f.inputUnit})</span></th>`).join('')}
    <th>Status</th><th></th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    html+=`<tr>
      <td>${i+1}</td><td>${r.nomor}</td><td>${r.specLabel}</td>
      ${fields.map(f=>{
        const v=r.values[f.key];
        if(!v) return '<td>-</td>';
        const cls=v.result&&!v.result.ok?'cell-fail':'cell-pass';
        const evHtml=v.evidence
          ?`<img src="${v.evidence.url}" class="ev-thumb-sm" data-url="${v.evidence.url}" data-cap="${r.nomor} — ${f.label}">`
          :`<span class="ev-none">-</span>`;
        return `<td><div class="ev-cell"><span class="${cls}">${v.raw}</span>${evHtml}</div></td>`;
      }).join('')}
      <td><span class="status-pill ${r.overall}">${r.overall}</span></td>
      <td><button class="del-btn" data-id="${r.id}">✕</button></td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  area.innerHTML=html;
  area.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{rows=rows.filter(r=>r.id!==parseInt(btn.dataset.id));renderTable();});
  });
  area.querySelectorAll('.ev-thumb-sm').forEach(img=>{
    img.addEventListener('click',()=>openLightbox(img.dataset.url,img.dataset.cap));
  });
}

// ===================== LIGHTBOX =====================
function openLightbox(url,caption){
  document.getElementById('lbImg').src=url;
  document.getElementById('lbCap').textContent=caption||'';
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }
document.getElementById('lbClose').addEventListener('click',closeLightbox);
document.getElementById('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') closeLightbox(); });

// ===================== CSV EXPORT =====================
document.getElementById('exportCsvBtn').addEventListener('click',()=>{
  if(!rows.length){ alert('Belum ada data.'); return; }
  const fields=activeSpec.fields;
  const header=['No','Identitas','Jenis Tiang',...fields.map(f=>`${f.label} (${f.inputUnit})`),'Status'];
  const lines=[header.join(',')];
  rows.forEach((r,i)=>{
    const row=[i+1,r.nomor,r.specLabel,...fields.map(f=>r.values[f.key]?.raw??''),r.overall];
    lines.push(row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`QC_Tiang_${activeSpec.id}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
});

// ===================== PDF EXPORT =====================
async function blobToBase64(url){
  const res=await fetch(url);
  const blob=await res.blob();
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

async function imgBase64ToDataUrl(b64){
  // already a data URL
  if(b64.startsWith('data:')) return b64;
  return b64;
}

document.getElementById('exportPdfBtn').addEventListener('click', async ()=>{
  if(!rows.length){ alert('Belum ada data.'); return; }
  const loader=document.getElementById('pdfLoading');
  const loaderText=document.getElementById('pdfLoadingText');
  loader.classList.add('show');

  try {
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const PW=297, PH=210, M=12;

    const dateStr=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});

    for(let ri=0;ri<rows.length;ri++){
      const r=rows[ri];
      loaderText.textContent=`Membuat PDF: tiang ${ri+1} / ${rows.length}...`;
      if(ri>0) doc.addPage();

      // ── HEADER ──
      doc.setFillColor(28,36,38);
      doc.rect(0,0,PW,20,'F');
      doc.setFillColor(179,121,31);
      doc.rect(0,20,PW,1.5,'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold');
      doc.setFontSize(13);
      doc.text('LAPORAN QC TIANG',M,13);
      doc.setFont('helvetica','normal');
      doc.setFontSize(9);
      doc.text('Telkom Indonesia — Pemeriksaan Mutu Tiang Beton',M,18.5);
      doc.setTextColor(180,200,195);
      doc.text(`Dicetak: ${dateStr}   |   Hal. ${ri+1} / ${rows.length}`,PW-M,13,{align:'right'});
      doc.text(`Dibuat oleh: Mighty`,PW-M,18.5,{align:'right'});

      // ── INFO TIANG ──
      let y=27;
      doc.setTextColor(28,36,38);
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(`Tiang: ${r.nomor}`,M,y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(`Jenis: ${r.specLabel}`,M,y+5.5);

      // status pill
      const isPass=r.overall==='PASS';
      doc.setFillColor(isPass?47:162, isPass?107:59, isPass?79:46);
      doc.roundedRect(PW-M-24,y-4,24,8,2,2,'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text(r.overall,PW-M-12,y+0.8,{align:'center'});

      // ── TABLE ──
      y=38;
      doc.setTextColor(28,36,38);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5);

      const cols=[
        {label:'Parameter',           w:52},
        {label:'Spesifikasi',         w:42},
        {label:'Input',               w:20},
        {label:'Nilai (satuan std)',   w:30},
        {label:'Status',              w:18},
        {label:'Evidence',            w:38},
      ];
      const TH=6.2; // row height
      let x=M;

      // header row
      doc.setFillColor(58,74,82);
      doc.rect(x,y,cols.reduce((a,c)=>a+c.w,0),TH,'F');
      doc.setTextColor(255,255,255);
      cols.forEach(c=>{ doc.text(c.label,x+2,y+4.2); x+=c.w; });

      const fields=r.fields || activeSpec.fields;

      // collect evidence base64 first
      const evidenceB64={};
      for(const f of fields){
        const v=r.values[f.key];
        if(v&&v.evidence&&v.evidence.url){
          try{ evidenceB64[f.key]=await blobToBase64(v.evidence.url); }catch(e){}
        }
      }

      // data rows
      for(let fi=0;fi<fields.length;fi++){
        const f=fields[fi];
        const v=r.values[f.key];
        const res=v&&v.result;
        const ok=res&&res.ok;
        const rowY=y+(fi+1)*TH;

        // check if need new page
        if(rowY+TH>PH-M){
          doc.addPage();
          // mini header on continuation
          doc.setFillColor(28,36,38);
          doc.rect(0,0,PW,10,'F');
          doc.setTextColor(255,255,255);
          doc.setFont('helvetica','bold'); doc.setFontSize(9);
          doc.text(`${r.nomor} — ${r.specLabel} (lanjutan)`,M,7);
          y=13-(fi+1)*TH; // adjust so rowY recalculates correctly
        }

        const curY=y+(fi+1)*TH;
        // stripe
        if(fi%2===0){ doc.setFillColor(238,241,238); doc.rect(M,curY,cols.reduce((a,c)=>a+c.w,0),TH,'F'); }

        // fail highlight
        if(res&&!ok){ doc.setFillColor(251,232,228); doc.rect(M,curY,cols.reduce((a,c)=>a+c.w,0),TH,'F'); }

        doc.setTextColor(28,36,38);
        doc.setFont('helvetica','normal'); doc.setFontSize(7);

        let cx=M;
        // col 0 parameter
        doc.text(f.label,cx+2,curY+4.2,{maxWidth:cols[0].w-3}); cx+=cols[0].w;
        // col 1 spec
        doc.setTextColor(179,121,31);
        doc.text(specText(f),cx+2,curY+4.2,{maxWidth:cols[1].w-3}); cx+=cols[1].w;
        doc.setTextColor(28,36,38);
        // col 2 input
        doc.text(v?v.raw+' '+f.inputUnit:'—',cx+2,curY+4.2); cx+=cols[2].w;
        // col 3 converted
        const cvt=res?Number(res.value.toFixed(2))+' '+f.unit:'—';
        doc.text(cvt,cx+2,curY+4.2); cx+=cols[3].w;
        // col 4 status
        if(res){
          doc.setTextColor(ok?47:162, ok?107:59, ok?79:46);
          doc.setFont('helvetica','bold');
          doc.text(ok?'PASS':'FAIL',cx+2,curY+4.2);
          doc.setFont('helvetica','normal'); doc.setTextColor(28,36,38);
        } else { doc.text('—',cx+2,curY+4.2); }
        cx+=cols[4].w;

        // col 5 evidence image
        const b64=evidenceB64[f.key];
        if(b64){
          try{
            const imgH=TH-1, imgW=imgH*(4/3);
            doc.addImage(b64,'JPEG',cx+1,curY+0.5,imgW,imgH);
          }catch(e){}
        } else {
          doc.setTextColor(150,160,158); doc.setFontSize(6.5);
          doc.text('no photo',cx+2,curY+4.2);
          doc.setTextColor(28,36,38); doc.setFontSize(7);
        }
      }

      // outer border
      doc.setDrawColor(199,205,196);
      doc.rect(M,y,cols.reduce((a,c)=>a+c.w,0),(fields.length+1)*TH);
      // vertical grid
      let bx=M;
      cols.forEach(c=>{ bx+=c.w; doc.line(bx,y,bx,y+(fields.length+1)*TH); });
      // horizontal grid
      for(let fi=0;fi<=fields.length;fi++){
        doc.setDrawColor(199,205,196);
        doc.line(M,y+fi*TH,M+cols.reduce((a,c)=>a+c.w,0),y+fi*TH);
      }

      // ── FOOTER ──
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      doc.setTextColor(93,112,121);
      const footY=PH-4;
      doc.text('QC Tiang — Telkom Indonesia',M,footY);
      doc.text(`${dateStr}`,PW/2,footY,{align:'center'});
      doc.text(`Halaman ${ri+1} dari ${rows.length}`,PW-M,footY,{align:'right'});
    }

    doc.save(`LaporanQC_Tiang_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(err){
    alert('Gagal membuat PDF: '+err.message);
    console.error(err);
  } finally {
    loader.classList.remove('show');
  }
});

// ===================== INIT =====================
renderForm();
renderTable();
</script>
